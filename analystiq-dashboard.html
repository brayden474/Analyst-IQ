<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — AnalystIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --navy-deep:#0B1D33;
    --navy:#122A47;
    --blue:#1F4C82;
    --gold:#C6A15B;
    --gold-bright:#E3C482;
    --paper:#F3EFE5;
    --paper-line:rgba(11,29,51,0.09);
    --ink:#101820;
    --ink-soft:#4B5A6B;
    --up:#3F7A4E;
    --down:#B5473A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    line-height:1.55;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; color:var(--navy-deep); margin:0; }
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){ .wrap{padding:0 18px;} }

  header{
    background:var(--navy-deep);
    padding:20px 0;
    border-bottom:1px solid rgba(230,196,130,0.2);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;color:var(--paper);}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  .nav-links{display:flex;gap:28px;font-size:0.92rem;}
  .nav-links a{color:rgba(243,239,229,0.7);text-decoration:none;}
  .nav-links a.active{color:var(--gold-bright);}
  .nav-links a:hover{color:var(--gold-bright);}

  .searchbar{
    padding:36px 0 0;
  }
  .search-row{display:flex;gap:10px;max-width:520px;}
  .search-row input{
    flex:1;
    padding:13px 16px;
    border:1px solid rgba(11,29,51,0.2);
    background:#fff;
    font-family:'Source Serif 4',serif;
    font-size:1rem;
    color:var(--ink);
  }
  .search-row input:focus{outline:none;border-color:var(--gold);}
  .search-row button{
    padding:0 24px;
    background:var(--navy-deep);
    color:var(--paper);
    border:1px solid var(--navy-deep);
    font-family:'Source Serif 4',serif;
    font-size:0.95rem;
    cursor:pointer;
  }
  .search-row button:hover{background:var(--blue);}
  .watchlist-hint{margin-top:10px;font-size:0.85rem;color:var(--ink-soft);}
  .watchlist-hint button{
    background:none;border:none;padding:0 4px;
    color:var(--blue);text-decoration:underline;cursor:pointer;
    font-family:inherit;font-size:inherit;
  }

  main{padding:32px 0 80px;}

  #dash-empty{
    margin-top:60px;
    text-align:center;
    color:var(--ink-soft);
    font-size:1rem;
  }

  #dash-content{display:none;}
  #dash-content.show{display:block;}

  .quote-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
    margin-top:28px;
    padding-bottom:22px;
    border-bottom:1px solid var(--paper-line);
  }
  .quote-head h1{font-size:2rem;}
  .quote-head .sym{color:var(--ink-soft);font-size:1.1rem;margin-left:8px;}
  .quote-price{text-align:right;}
  .quote-price .amt{font-family:'Fraunces',serif;font-size:2.2rem;color:var(--navy-deep);}
  .quote-price .chg{font-size:1rem;margin-top:4px;}
  .quote-price .chg.up{color:var(--up);}
  .quote-price .chg.down{color:var(--down);}

  .metrics-row{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
    margin-top:26px;
    border-top:1px solid var(--paper-line);
    border-left:1px solid var(--paper-line);
  }
  @media (max-width:760px){ .metrics-row{grid-template-columns:repeat(2,1fr);} }
  .metric{
    border-right:1px solid var(--paper-line);
    border-bottom:1px solid var(--paper-line);
    padding:18px 20px;
  }
  .metric .label{font-size:0.82rem;color:var(--ink-soft);}
  .metric .val{font-family:'Fraunces',serif;font-size:1.25rem;color:var(--navy-deep);margin-top:6px;}

  .chart-panel{
    margin-top:32px;
    background:#fff;
    border:1px solid var(--paper-line);
    padding:24px;
  }
  .chart-panel h3{font-size:1rem;color:var(--ink-soft);font-weight:500;margin-bottom:16px;}
  .chart-note{margin-top:14px;font-size:0.82rem;color:var(--ink-soft);font-style:italic;}

  .watchlist-panel{margin-top:40px;}
  .watchlist-panel h3{font-size:1.15rem;margin-bottom:16px;}
  .wl-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .wl-chip{
    background:#fff;
    border:1px solid var(--paper-line);
    padding:10px 16px;
    cursor:pointer;
    font-size:0.9rem;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wl-chip:hover{border-color:var(--gold);}
  .wl-chip .sym{font-weight:600;color:var(--navy-deep);}
  .wl-chip .p{color:var(--ink-soft);}

  #dash-error{
    margin-top:24px;
    background:#F6E6E1;
    border-left:2px solid var(--down);
    padding:14px 18px;
    color:#7A2E20;
    font-size:0.92rem;
    display:none;
  }
  #dash-error.show{display:block;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand"><span class="dot"></span> AnalystIQ</div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="#" class="active">Dashboard</a>
      <a href="analystiq-book.html">The Guide</a>
    </nav>
  </div>
</header>

<div class="wrap searchbar">
  <div class="search-row">
    <input id="ticker-input" type="text" placeholder="Look up a ticker — e.g. AAPL, MSFT, SPY" onkeydown="if(event.key==='Enter') lookupTicker()">
    <button onclick="lookupTicker()">Look up</button>
  </div>
  <div class="watchlist-hint">Try
    <button onclick="lookupTicker('AAPL')">AAPL</button>·
    <button onclick="lookupTicker('MSFT')">MSFT</button>·
    <button onclick="lookupTicker('SPY')">SPY</button>
  </div>
</div>

<main class="wrap">
  <div id="dash-error"></div>

  <div id="dash-empty">Search a ticker above to see its live price, key metrics, and recent trend.</div>

  <div id="dash-content">
    <div class="quote-head">
      <div>
        <h1 id="q-name">—<span class="sym" id="q-symbol"></span></h1>
      </div>
      <div class="quote-price">
        <div class="amt" id="q-price">$0.00</div>
        <div class="chg" id="q-change">—</div>
      </div>
    </div>

    <div class="metrics-row">
      <div class="metric"><div class="label">52-Week High</div><div class="val" id="m-52wk">—</div></div>
      <div class="metric"><div class="label">P/E Ratio</div><div class="val" id="m-pe">—</div></div>
      <div class="metric"><div class="label">Today's Change</div><div class="val" id="m-change">—</div></div>
      <div class="metric"><div class="label">Status</div><div class="val" id="m-status">—</div></div>
    </div>

    <div class="chart-panel">
      <h3>Recent price trend</h3>
      <canvas id="price-chart" height="90"></canvas>
      <div class="chart-note" id="chart-note"></div>
    </div>
  </div>

  <div class="watchlist-panel">
    <h3>Quick watchlist</h3>
    <div class="wl-grid" id="wl-grid"></div>
  </div>
</main>

<script>
  // CONFIGURE: point this at your deployed backend (marketiq-backend-FULL.js).
  // Leave as '' if this page is served from the same domain as the API.
  const API_BASE = 'https://analyst-iq.onrender.com';

  const WATCHLIST = ['AAPL', 'MSFT', 'AMZN', 'SPY', 'NVDA'];
  let priceChart = null;

  function showError(msg) {
    const el = document.getElementById('dash-error');
    el.textContent = msg;
    el.classList.add('show');
  }
  function clearError() {
    document.getElementById('dash-error').classList.remove('show');
  }

  async function lookupTicker(presetSymbol) {
    const input = document.getElementById('ticker-input');
    const symbol = (presetSymbol || input.value).trim().toUpperCase();
    if (!symbol) return;
    input.value = symbol;
    clearError();

    try {
      const res = await fetch(`${API_BASE}/api/market/stocks/${symbol}`);
      if (!res.ok) throw new Error('Lookup failed: ' + res.status);
      const data = await res.json();
      renderQuote(symbol, data);
    } catch (err) {
      console.error('Dashboard lookup error:', err);
      showError(`Couldn't load data for ${symbol}. Debug info: ${err && err.message ? err.message : String(err)}`);
    }
  }

  function renderQuote(symbol, data) {
    document.getElementById('dash-empty').style.display = 'none';
    document.getElementById('dash-content').classList.add('show');

    document.getElementById('q-symbol').textContent = ' ' + symbol;
    document.getElementById('q-name').firstChild.textContent = symbol;

    const price = data.currentPrice ?? data.c ?? null;
    const changePct = data.dp ?? null;

    document.getElementById('q-price').textContent = price != null ? `$${Number(price).toFixed(2)}` : '—';

    const changeEl = document.getElementById('q-change');
    if (changePct != null) {
      const up = changePct >= 0;
      changeEl.textContent = `${up ? '+' : ''}${Number(changePct).toFixed(2)}% today`;
      changeEl.className = 'chg ' + (up ? 'up' : 'down');
    } else {
      changeEl.textContent = 'Change unavailable';
      changeEl.className = 'chg';
    }

    document.getElementById('m-52wk').textContent = data.metric?.['52WeekHigh'] ? `$${data.metric['52WeekHigh']}` : '—';
    document.getElementById('m-pe').textContent = data.metric?.['pfcfTTM'] ?? '—';
    document.getElementById('m-change').textContent = changePct != null ? `${changePct}%` : '—';
    document.getElementById('m-status').textContent = data.status || 'Live';

    renderChart(symbol, price);
  }

  function renderChart(symbol, currentPrice) {
    const note = document.getElementById('chart-note');
    const ctx = document.getElementById('price-chart').getContext('2d');

    // Your backend doesn't yet return historical daily closes — only a
    // current snapshot. Until you add a historical-data endpoint (Finnhub's
    // /stock/candle or Alpha Vantage's TIME_SERIES_DAILY both work), this
    // chart plots a flat reference line at the current price so the layout
    // is ready to receive real series data.
    const labels = ['-6d','-5d','-4d','-3d','-2d','-1d','Today'];
    const flatSeries = labels.map(() => currentPrice || 0);

    if (priceChart) priceChart.destroy();
    priceChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: symbol,
          data: flatSeries,
          borderColor: '#1F4C82',
          backgroundColor: 'rgba(31,76,130,0.08)',
          fill: true,
          tension: 0.25,
          pointRadius: 3,
          pointBackgroundColor: '#C6A15B'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: 'rgba(11,29,51,0.06)' } },
          x: { grid: { display: false } }
        }
      }
    });

    note.textContent = 'Placeholder trend line — wire up a historical-candles endpoint on your backend to show real daily movement here.';
  }

  function renderWatchlist() {
    const grid = document.getElementById('wl-grid');
    grid.innerHTML = '';
    WATCHLIST.forEach(sym => {
      const chip = document.createElement('div');
      chip.className = 'wl-chip';
      chip.innerHTML = `<span class="sym">${sym}</span><span class="p">tap to load</span>`;
      chip.onclick = () => lookupTicker(sym);
      grid.appendChild(chip);
    });
  }

  renderWatchlist();
</script>

</body>
</html>
