<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Calendar — AnalystIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0B1D33; --blue:#1F4C82; --gold:#C6A15B; --gold-bright:#E3C482;
    --paper:#F3EFE5; --paper-line:rgba(11,29,51,0.09); --ink:#101820; --ink-soft:#4B5A6B;
    --up:#3F7A4E; --down:#B5473A;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Source Serif 4', Georgia, serif; }
  header{ background:var(--navy-deep); color:var(--paper); padding:26px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  .brand{ display:flex;align-items:center;gap:10px; font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem; }
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);}
  header .subtitle{ font-size:0.85rem; color:var(--gold-bright); opacity:0.85; }
  .container{ max-width:820px; margin:0 auto; padding:32px 24px 60px; }
  h1{ font-family:'Fraunces',serif; font-size:1.6rem; margin:0 0 6px; color:var(--navy-deep); }
  .range-note{ font-size:0.85rem; color:var(--ink-soft); margin-bottom:24px; }

  .day-group{ margin-bottom:22px; }
  .day-heading{
    font-family:'Fraunces',serif; font-size:1rem; color:var(--navy-deep);
    padding-bottom:6px; border-bottom:1px solid var(--paper-line); margin-bottom:10px;
  }

  table{ width:100%; border-collapse:collapse; background:#fff; }
  thead th{
    text-align:left; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--ink-soft); padding:8px 12px; border-bottom:1px solid var(--paper-line);
  }
  tbody tr{ border-bottom:1px solid var(--paper-line); }
  tbody td{ padding:10px 12px; font-size:0.9rem; }
  .symbol-cell{ font-weight:600; color:var(--navy-deep); }
  .timing-badge{
    font-size:0.72rem; padding:2px 8px; border-radius:2px;
    background:var(--paper); color:var(--ink-soft); text-transform:uppercase;
  }
  .beat{ color:var(--up); }
  .miss{ color:var(--down); }
  .na{ color:var(--ink-soft); opacity:0.6; }

  #status{ padding:30px 0; text-align:center; color:var(--ink-soft); }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> AnalystIQ</div>
  <div class="subtitle">Earnings Calendar</div>
</header>

<div class="container">
  <h1>Upcoming Earnings</h1>
  <div class="range-note">Showing scheduled reports for the next 14 days.</div>

  <div id="status">Loading earnings calendar...</div>
  <div id="calendar-body"></div>
</div>

<script>
  const API_BASE = 'https://analyst-iq.onrender.com'; // CONFIGURE: point this at your deployed backend.

  async function loadEarnings() {
    const status = document.getElementById('status');
    const container = document.getElementById('calendar-body');

    try {
      const res = await fetch(API_BASE + '/api/market/earnings');
      const data = await res.json();

      if (!data.events || data.events.length === 0) {
        status.textContent = 'No earnings reports scheduled in this window.';
        return;
      }

      status.style.display = 'none';

      // Group by date
      const byDate = {};
      data.events.forEach(e => {
        if (!byDate[e.date]) byDate[e.date] = [];
        byDate[e.date].push(e);
      });

      const dates = Object.keys(byDate).sort();

      container.innerHTML = dates.map(date => `
        <div class="day-group">
          <div class="day-heading">${new Date(date + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })}</div>
          <table>
            <thead>
              <tr><th>Symbol</th><th>Timing</th><th>EPS Estimate</th><th>EPS Actual</th></tr>
            </thead>
            <tbody>
              ${byDate[date].map(e => `
                <tr>
                  <td class="symbol-cell">${e.symbol}</td>
                  <td><span class="timing-badge">${timingLabel(e.hour)}</span></td>
                  <td>${e.epsEstimate !== null && e.epsEstimate !== undefined ? '$' + Number(e.epsEstimate).toFixed(2) : '<span class="na">—</span>'}</td>
                  <td class="${epsClass(e)}">${e.epsActual !== null && e.epsActual !== undefined ? '$' + Number(e.epsActual).toFixed(2) : '<span class="na">—</span>'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `).join('');
    } catch (err) {
      console.error('Earnings load error:', err);
      status.textContent = 'Could not load the earnings calendar. Is the backend running?';
    }
  }

  function timingLabel(hour) {
    if (hour === 'bmo') return 'Before Open';
    if (hour === 'amc') return 'After Close';
    return 'Unspecified';
  }

  function epsClass(e) {
    if (e.epsActual === null || e.epsActual === undefined || e.epsEstimate === null || e.epsEstimate === undefined) return '';
    return e.epsActual >= e.epsEstimate ? 'beat' : 'miss';
  }

  loadEarnings();
</script>

</body>
</html>
